 // doors across each split line

 for(let k=1;k<rooms.length;k++){const o=rooms[k];const n=r()<.6?1:2;for(let z=0;z<n;z++){const x=o.x+.5+r()*(o.w-1),y=o.y+.5+r()*(o.h-1);if(free(x,y))spawns.push({x,y})}
